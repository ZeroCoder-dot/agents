# OpenKruise CustomFuse PersistentVolume Example
# This PV uses the customfuse CSI driver with JuiceFS as FUSE client.
#
# Prerequisites:
#   1. csi-sidecar-customfuse container in SandboxSet template
#   2. Redis (metadata engine) + S3-compatible storage (MinIO/OSS/etc.)
#   3. Secret with JuiceFS credentials (see secret.yaml)
#
# Parameters:
#   source       — JuiceFS META-URL (redis://host:port/db)
#   fuseType     — FUSE client type (default "customfuse", set to "juicefs")
#   bucket       — (optional) S3 bucket name
#   url          — (optional) S3 endpoint URL
#   storageType  — (optional) object storage type (default "s3"; "oss", "minio", ...)
#   path         — (optional) sub-path mounted as the volume root (--subdir)
#   capacity     — (optional) capacity quota (e.g. "100Gi")
#   otherOpts    — (optional) extra FUSE mount options
#
# Note: pv.spec.mountOptions is not consumed by the entrypoint (each entry
# would become a separate env var that the script does not read); put extra
# mount options in volumeAttributes.otherOpts instead.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: juicefs-imagenet
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: customfuseplugin.csi.alibabacloud.com
    fsType: juicefs
    volumeHandle: imagenet-dataset
    volumeAttributes:
      source: "redis://redis-cluster.sandbox-system:6379/0"
      fuseType: "juicefs"
      bucket: "ml-datasets"
      # url: "https://s3.amazonaws.com"
      # path: "/shared"
      # capacity: "100Gi"
      # otherOpts: "cache-size=1024"
    nodePublishSecretRef:
      name: juicefs-imagenet-secret
      namespace: sandbox-system
