# JuiceFS Credentials Secret
# All keys are passed directly as environment variables to the entrypoint
# script. The entrypoint author controls the env-var schema by naming the
# Secret keys accordingly.
#
# Supported keys for the JuiceFS entrypoint (entrypoint-juicefs.sh):
#   token       — JuiceFS authentication token (recommended)
#   access_key  — object storage access key ID
#   secret_key  — object storage access key secret
#
# Unrecognized keys are still passed to the entrypoint as env vars.
# Keys must be valid environment variable names ([A-Za-z_][A-Za-z0-9_]*):
# bash cannot reference names with dashes, so dash-containing keys are
# rejected by the CustomFuseMountProvider before the request is generated.
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-imagenet-secret
  namespace: sandbox-system
type: Opaque
stringData:
  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
  access_key: "AKIAIOSFODNN7EXAMPLE"
  secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
